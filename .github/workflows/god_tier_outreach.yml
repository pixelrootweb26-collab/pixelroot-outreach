name: 24/7 Autonomous Outreach Engine

on:
  schedule:
    # Runs twice daily at 14:30 UTC (9:30 AM EST) and 19:30 UTC (2:30 PM EST)
    - cron: '30 14 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch: # Lets you click "Run workflow" manually anytime to test immediately

jobs:
  outreach-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Outreach Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python outreach_engine.py
